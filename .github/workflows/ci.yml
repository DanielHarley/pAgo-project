name: CI

on:
  push:
  pull_request:

jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip check

      - name: Print environment
        run: |
          python scripts/print_environment.py

      - name: Verify raw data hashes
        run: |
          python scripts/verify_raw_data.py

      - name: Verify Pfam HMM reference bundle
        run: |
          python scripts/verify_reference_data.py --scope pfam

      - name: Run tests
        run: |
          python -m unittest discover -s tests -q

  windows-snapshot-reuse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip check

      - name: Verify Pfam HMM resources with PyHMMER on Windows
        run: |
          python scripts/verify_reference_data.py --scope pfam

      - name: Run Windows snapshot reuse and PyHMMER tests
        run: |
          python -m unittest tests.test_sweep_genes_snapshot tests.test_pca_kmeans_snapshot tests.test_pfam_hmm_bundle tests.test_pfam_hmm_bundle_snapshot
