[project]
name = "pago-project"
version = "0.1.0"
description = "Reproducible pipeline for pAgo protein metadata, sequence embeddings, and exploratory ML analysis."
requires-python = ">=3.14,<3.15"
dependencies = [
    "biopython",
    "h5py",
    "ipykernel",
    "joblib",
    "numpy",
    "pandas",
    "plotly",
    "psutil",
    "pyhmmer==0.12.3",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
# Curation / development only: needed solely to reconstruct the APAZ Phase B
# reference resources with scripts/regenerate_apaz_reference.py. Not imported by
# the pipeline at runtime and deliberately kept out of requirements.lock.txt.
# scripts/derive_apaz_split_groups.py additionally needs an external MMseqs2
# (bioconda, pinned in src/pago_pipeline/resources/apaz_seed/seeds_lock.json),
# which has no pip wheel contract.
curation = [
    "pyfamsa==0.7.0",
]
