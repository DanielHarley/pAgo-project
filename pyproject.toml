[project]
name = "pago-project"
version = "0.1.0"
description = "Reproducible pipeline for pAgo protein metadata, sequence embeddings, and exploratory ML analysis."
requires-python = ">=3.14,<3.15"
dependencies = [
    "biopython",
    "h5py",
    "ipykernel",
    "joblib",
    "numpy",
    "pandas",
    "plotly",
    "psutil",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
# Curation / development only: not imported by the pipeline at runtime and
# deliberately kept out of requirements.lock.txt.
curation = [
    # scripts/build_clade_reference_catalog.py: reads the Ryazansky 2018
    # Table S1 .xls workbook.
    "xlrd==2.0.2",
]
